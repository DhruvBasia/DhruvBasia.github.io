name: Refresh GitHub snapshot

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-github.mjs']

permissions:
  contents: write

concurrency:
  group: refresh-github
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.mjs DhruvBasia
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/github.json data/github.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json data/github.js
          git commit -m "chore: refresh GitHub snapshot"
          git push
